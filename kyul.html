(function () {

  var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.wwdwwg.kyul';

  document.documentElement.dataset.store = isIOS ? 'ios' : isAndroid ? 'android' : 'other';
  var lang = 'en';
  try { lang = localStorage.getItem('kyul-lang') || ((navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en'); } catch (e) {}
  document.documentElement.dataset.lang = lang === 'ko' ? 'ko' : 'en';
  document.documentElement.lang = document.documentElement.dataset.lang;
  document.title = lang === 'ko' ? '결 Kyul 받기 — 수묵 한글 퍼즐' : 'Get Kyul 결 — Ink Word Puzzle';
  if (isIOS) location.replace(APP_STORE);
  else if (isAndroid) location.replace(PLAY_STORE);
})();
